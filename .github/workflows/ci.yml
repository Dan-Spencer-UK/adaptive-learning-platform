name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Install, typecheck, lint, unit test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies (reproducible)
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test:unit

      - name: Pedagogical content coverage gate (CC-05A)
        run: npm run content:pedagogy:check

      - name: Mobile/web UI boundary check
        run: npm run check:mobile-boundary

      - name: Mobile unit/component tests (Jest)
        run: npm run mobile:test

      - name: Mobile Expo config sanity (expo-doctor)
        working-directory: apps/mobile
        run: npx expo-doctor

      - name: Mobile Metro bundle validation (Android + iOS, no native SDK required)
        working-directory: apps/mobile
        run: |
          npx expo export --platform android --output-dir /tmp/expo-export-android
          npx expo export --platform ios --output-dir /tmp/expo-export-ios

      - name: Build
        run: npm run build

  e2e:
    name: Playwright smoke tests (local Supabase auth)
    runs-on: ubuntu-latest
    needs: checks
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies (reproducible)
        run: npm ci

      - name: Start local Supabase stack
        run: npx supabase start

      - name: Reset database (apply migrations + seed from repository state)
        run: npx supabase db reset

      - name: Configure local Supabase environment for the web app
        run: |
          API_URL=$(npx supabase status -o env | grep '^API_URL=' | cut -d'=' -f2- | tr -d '"')
          PUBLISHABLE_KEY=$(npx supabase status -o env | grep '^PUBLISHABLE_KEY=' | cut -d'=' -f2- | tr -d '"')
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL"
            echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=$PUBLISHABLE_KEY"
          } > apps/web/.env.local

      - name: Install Playwright browser (chromium only)
        run: npx playwright install --with-deps chromium

      - name: End-to-end smoke test
        run: npm run test:e2e

      - name: Accessibility smoke test
        run: npm run test:a11y

      - name: Stop local Supabase stack
        if: always()
        run: npx supabase stop

  audit:
    name: Dependency security audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies (reproducible)
        run: npm ci

      - name: npm audit (high and critical, governed exception gate)
        run: npm run security:audit

  database:
    name: Supabase local database (migrations, pgTAP, types)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies (reproducible)
        run: npm ci

      - name: Start local Supabase stack
        run: npx supabase start

      - name: Reset database (apply migrations + seed from repository state)
        run: npx supabase db reset

      - name: pgTAP database tests
        run: npm run db:test

      - name: Database lint (public schema)
        run: npm run db:lint

      - name: Regenerate database types and verify no diff
        run: npm run db:types:check

      - name: Stop local Supabase stack
        if: always()
        run: npx supabase stop
