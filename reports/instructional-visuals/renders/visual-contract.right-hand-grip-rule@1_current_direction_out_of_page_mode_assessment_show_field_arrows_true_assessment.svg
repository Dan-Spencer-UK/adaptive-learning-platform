<svg xmlns="http://www.w3.org/2000/svg" width="260" height="240" viewBox="0 0 260 240" role="img" aria-label="Right-hand grip rule. The thumb points along the conductor, in the direction the current flows: out of the page. The direction the fingers curl (the magnetic field direction) is not shown."><title>Right-hand grip rule. The thumb points along the conductor, in the direction the current flows: out of the page. The direction the fingers curl (the magnetic field direction) is not shown.</title><g><circle cx="175" cy="95" r="14" fill="#0b0d12" stroke="#f2f4f8" stroke-width="2" /><circle cx="175" cy="95" r="3" fill="#f2f4f8" /><path d="M40,100 Q34,128 56,138 Q80,148 100,132 Q106,118 92,108 Q84,96 68,94 Q50,92 40,100 Z" fill="#151821" stroke="#f2f4f8" stroke-width="2" /><line x1="92" y1="128" x2="159" y2="99" stroke="#4c8dff" stroke-width="13" stroke-linecap="round" /><text x="80" y="150" fill="#4c8dff" font-size="11" font-weight="700" text-anchor="middle"><tspan>Thumb</tspan></text><text x="80" y="163" fill="#9aa3b2" font-size="10" text-anchor="middle"><tspan>(current direction)</tspan></text><path d="M50,96 Q78,44 155,72" fill="none" stroke="#f2f4f8" stroke-width="9" stroke-linecap="round" /><path d="M58,90 Q90,36 158,62" fill="none" stroke="#f2f4f8" stroke-width="9" stroke-linecap="round" /><path d="M67,86 Q100,30 160,53" fill="none" stroke="#f2f4f8" stroke-width="9" stroke-linecap="round" /><path d="M76,84 Q110,28 161,44" fill="none" stroke="#f2f4f8" stroke-width="9" stroke-linecap="round" /><text x="90" y="40" fill="#f2f4f8" font-size="11" font-weight="700" text-anchor="middle"><tspan>Fingers</tspan></text><text x="90" y="53" fill="#9aa3b2" font-size="10" text-anchor="middle"><tspan>(field direction)</tspan></text><text x="175" y="205" fill="#9aa3b2" font-size="11" text-anchor="middle"><tspan>current out of the page</tspan></text></g></svg>