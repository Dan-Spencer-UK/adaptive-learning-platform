<svg xmlns="http://www.w3.org/2000/svg" width="260" height="200" viewBox="0 0 260 200" role="img" aria-label="Comparing conductor length, with cross-sectional area and material held the same: the shorter rod has less resistance, and the longer rod has more resistance."><title>Comparing conductor length, with cross-sectional area and material held the same: the shorter rod has less resistance, and the longer rod has more resistance.</title><g><rect x="46" y="39" width="58" height="22" fill="#0b0d12" stroke="#f2f4f8" stroke-width="2" /><ellipse cx="104" cy="50" rx="6" ry="11" fill="#0b0d12" stroke="#f2f4f8" stroke-width="2" /><ellipse cx="46" cy="50" rx="6" ry="11" fill="#0b0d12" stroke="#f2f4f8" stroke-width="2" /><line x1="40" y1="75" x2="110" y2="75" stroke="#9aa3b2" stroke-width="1.5" /><line x1="40" y1="70" x2="40" y2="80" stroke="#9aa3b2" stroke-width="1.5" /><line x1="110" y1="70" x2="110" y2="80" stroke="#9aa3b2" stroke-width="1.5" /><text x="75" y="67" fill="#9aa3b2" font-size="12" font-weight="700" text-anchor="middle"><tspan>L</tspan></text><text x="75" y="29" fill="#f2f4f8" font-size="11" text-anchor="middle"><tspan>shorter -&gt; less resistance</tspan></text><rect x="46" y="119" width="158" height="22" fill="#0b0d12" stroke="#f2f4f8" stroke-width="2" /><ellipse cx="204" cy="130" rx="6" ry="11" fill="#0b0d12" stroke="#f2f4f8" stroke-width="2" /><ellipse cx="46" cy="130" rx="6" ry="11" fill="#0b0d12" stroke="#f2f4f8" stroke-width="2" /><line x1="40" y1="155" x2="210" y2="155" stroke="#9aa3b2" stroke-width="1.5" /><line x1="40" y1="150" x2="40" y2="160" stroke="#9aa3b2" stroke-width="1.5" /><line x1="210" y1="150" x2="210" y2="160" stroke="#9aa3b2" stroke-width="1.5" /><text x="125" y="147" fill="#9aa3b2" font-size="12" font-weight="700" text-anchor="middle"><tspan>L</tspan></text><text x="125" y="109" fill="#f2f4f8" font-size="11" text-anchor="middle"><tspan>longer -&gt; more resistance</tspan></text></g></svg>