<svg xmlns="http://www.w3.org/2000/svg" width="260" height="140" viewBox="0 0 260 140" role="img" aria-label="Two bar magnets facing each other: the north pole of the left magnet faces the south pole of the right magnet. Because the facing poles are north and south (unlike poles), the magnets attract each other."><title>Two bar magnets facing each other: the north pole of the left magnet faces the south pole of the right magnet. Because the facing poles are north and south (unlike poles), the magnets attract each other.</title><g><text x="40" y="76" fill="#f2f4f8" font-size="18" font-weight="700" text-anchor="middle"><tspan>S</tspan></text><text x="80" y="76" fill="#f2f4f8" font-size="18" font-weight="700" text-anchor="middle"><tspan>N</tspan></text><rect x="20" y="45" width="80" height="50" rx="3" fill="none" stroke="#f2f4f8" stroke-width="2" /><text x="180" y="76" fill="#f2f4f8" font-size="18" font-weight="700" text-anchor="middle"><tspan>S</tspan></text><text x="220" y="76" fill="#f2f4f8" font-size="18" font-weight="700" text-anchor="middle"><tspan>N</tspan></text><rect x="160" y="45" width="80" height="50" rx="3" fill="none" stroke="#f2f4f8" stroke-width="2" /><line x1="88" y1="70" x2="110" y2="70" stroke="#4cd07a" stroke-width="2.5" /><path d="M110 70 103.07179676972449 74 103.07179676972449 66z" fill="#4cd07a" /><line x1="172" y1="70" x2="150" y2="70" stroke="#4cd07a" stroke-width="2.5" /><path d="M150 70 156.9282032302755 66 156.9282032302755 74z" fill="#4cd07a" /><text x="130" y="40" fill="#4cd07a" font-size="12" font-weight="700" text-anchor="middle"><tspan>Attract</tspan></text><text x="130" y="128" fill="#9aa3b2" font-size="11" text-anchor="middle"><tspan>unlike poles facing</tspan></text></g></svg>