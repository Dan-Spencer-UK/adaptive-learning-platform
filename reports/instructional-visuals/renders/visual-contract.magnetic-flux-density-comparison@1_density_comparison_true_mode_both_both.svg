<svg xmlns="http://www.w3.org/2000/svg" width="260" height="278" viewBox="0 0 260 278" role="img" aria-label="A bar magnet with curved field lines arcing from the north pole, around, to the south pole -- this whole pattern of field lines is the magnetic flux. Below, the same number of field lines passes through two gates of different width: a wider gate on the left, giving lower flux density (the same flux spread over a larger area), and a narrower gate on the right, giving higher flux density (the same flux concentrated over a smaller area)."><title>A bar magnet with curved field lines arcing from the north pole, around, to the south pole -- this whole pattern of field lines is the magnetic flux. Below, the same number of field lines passes through two gates of different width: a wider gate on the left, giving lower flux density (the same flux spread over a larger area), and a narrower gate on the right, giving higher flux density (the same flux concentrated over a smaller area).</title><g><rect x="110" y="16" width="40" height="48" fill="none" stroke="#f2f4f8" stroke-width="2" /><text x="130" y="46" fill="#f2f4f8" font-size="16" font-weight="700" text-anchor="middle"><tspan>N</tspan></text><rect x="110" y="64" width="40" height="48" fill="none" stroke="#f2f4f8" stroke-width="2" /><text x="130" y="94" fill="#f2f4f8" font-size="16" font-weight="700" text-anchor="middle"><tspan>S</tspan></text><path d="M115,16 Q60,64 115,112" fill="none" stroke="#f2f4f8" stroke-width="2" /><path d="M115,112 L108.13123588415056,110.65089677162231 L112.73397561017796,105.37692416888258 Z" fill="#f2f4f8" /><path d="M125,16 Q95,64 125,112" fill="none" stroke="#f2f4f8" stroke-width="2" /><path d="M125,112 L118.81905811383115,108.71427977456945 L124.75504624186675,105.00428719454719 Z" fill="#f2f4f8" /><path d="M135,16 Q165,64 135,112" fill="none" stroke="#f2f4f8" stroke-width="2" /><path d="M135,112 L135.24495375813325,105.00428719454719 L141.18094188616885,108.71427977456945 Z" fill="#f2f4f8" /><path d="M145,16 Q200,64 145,112" fill="none" stroke="#f2f4f8" stroke-width="2" /><path d="M145,112 L147.26602438982204,105.37692416888258 L151.86876411584944,110.65089677162231 Z" fill="#f2f4f8" /><text x="130" y="134" fill="#9aa3b2" font-size="11" text-anchor="middle"><tspan>magnetic flux (field lines, N to S)</tspan></text><text x="130" y="164" fill="#9aa3b2" font-size="10" text-anchor="middle"><tspan>the same number of field lines through each gate</tspan></text><line x1="20" y1="190" x2="130" y2="190" stroke="#f2f4f8" stroke-width="2" /><line x1="20" y1="202" x2="130" y2="202" stroke="#f2f4f8" stroke-width="2" /><line x1="20" y1="214" x2="130" y2="214" stroke="#f2f4f8" stroke-width="2" /><line x1="20" y1="226" x2="130" y2="226" stroke="#f2f4f8" stroke-width="2" /><line x1="40" y1="178" x2="40" y2="238" stroke="#9aa3b2" stroke-width="1.5" /><line x1="110" y1="178" x2="110" y2="238" stroke="#9aa3b2" stroke-width="1.5" /><text x="75" y="258" fill="#9aa3b2" font-size="10" text-anchor="middle"><tspan>same flux, larger area</tspan></text><text x="75" y="274" fill="#f2f4f8" font-size="12" font-weight="700" text-anchor="middle"><tspan>Lower density</tspan></text><line x1="145" y1="190" x2="225" y2="190" stroke="#f2f4f8" stroke-width="2" /><line x1="145" y1="202" x2="225" y2="202" stroke="#f2f4f8" stroke-width="2" /><line x1="145" y1="214" x2="225" y2="214" stroke="#f2f4f8" stroke-width="2" /><line x1="145" y1="226" x2="225" y2="226" stroke="#f2f4f8" stroke-width="2" /><line x1="165" y1="178" x2="165" y2="238" stroke="#9aa3b2" stroke-width="1.5" /><line x1="205" y1="178" x2="205" y2="238" stroke="#9aa3b2" stroke-width="1.5" /><text x="185" y="258" fill="#9aa3b2" font-size="10" text-anchor="middle"><tspan>same flux, smaller area</tspan></text><text x="185" y="274" fill="#f2f4f8" font-size="12" font-weight="700" text-anchor="middle"><tspan>Higher density</tspan></text></g></svg>