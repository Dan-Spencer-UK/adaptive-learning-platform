<svg xmlns="http://www.w3.org/2000/svg" width="260" height="220" viewBox="0 0 260 220" role="img" aria-label="North pole on the left, south pole on the right. A single loop of wire rotates on a central vertical axis between the poles, with slip-ring connections at the axis carrying the output to the external circuit. The loop is shown face-on, its plane at right angles to the field lines, directly facing the poles -- the position where it is momentarily not cutting flux lines, producing an EMF near zero."><title>North pole on the left, south pole on the right. A single loop of wire rotates on a central vertical axis between the poles, with slip-ring connections at the axis carrying the output to the external circuit. The loop is shown face-on, its plane at right angles to the field lines, directly facing the poles -- the position where it is momentarily not cutting flux lines, producing an EMF near zero.</title><g><rect x="16" y="70" width="28" height="60" rx="3" fill="none" stroke="#f2f4f8" stroke-width="2" /><text x="30" y="106" fill="#f2f4f8" font-size="18" font-weight="700" text-anchor="middle"><tspan>N</tspan></text><rect x="216" y="70" width="28" height="60" rx="3" fill="none" stroke="#f2f4f8" stroke-width="2" /><text x="230" y="106" fill="#f2f4f8" font-size="18" font-weight="700" text-anchor="middle"><tspan>S</tspan></text><line x1="54" y1="76" x2="206" y2="76" stroke="#9aa3b2" stroke-width="2" /><path d="M206,76 L199.93782217350892,79.5 L199.93782217350892,72.5 Z" fill="#9aa3b2" /><line x1="54" y1="100" x2="206" y2="100" stroke="#9aa3b2" stroke-width="2" /><path d="M206,100 L199.93782217350892,103.5 L199.93782217350892,96.5 Z" fill="#9aa3b2" /><line x1="54" y1="124" x2="206" y2="124" stroke="#9aa3b2" stroke-width="2" /><path d="M206,124 L199.93782217350892,127.5 L199.93782217350892,120.5 Z" fill="#9aa3b2" /><line x1="130" y1="35" x2="130" y2="165" stroke="#9aa3b2" stroke-width="1.5" /><ellipse cx="130" cy="100" rx="52" ry="16" fill="#0b0d12" stroke="#f2f4f8" stroke-width="3" /><path d="M116.84430330899728,35.21171799344064 A14,14 0 1 1 119.27537779633431,48.99902653561156" fill="none" stroke="#9aa3b2" stroke-width="1.5" /><path d="M119.27537779633431,48.99902653561156 L124.91353352104976,51.05114739556558 L120.3172668623359,54.90787305368481 Z" fill="#9aa3b2" /><line x1="130" y1="35" x2="164" y2="17" stroke="#9aa3b2" stroke-width="1.5" /><line x1="130" y1="165" x2="164" y2="183" stroke="#9aa3b2" stroke-width="1.5" /><circle cx="168" cy="15" r="3" fill="#9aa3b2" /><circle cx="168" cy="185" r="3" fill="#9aa3b2" /><text x="174" y="189" fill="#9aa3b2" font-size="10" text-anchor="start"><tspan>Output</tspan></text><text x="130" y="212" fill="#f2f4f8" font-size="12" font-weight="700" text-anchor="middle"><tspan>Loop plane facing poles (near-zero EMF)</tspan></text></g></svg>