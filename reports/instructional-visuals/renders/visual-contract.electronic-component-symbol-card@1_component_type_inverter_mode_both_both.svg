<svg xmlns="http://www.w3.org/2000/svg" width="240" height="210" viewBox="0 0 240 210" role="img" aria-label="Inverter: a functional block, not a single schematic symbol -- a DC input arrow and an AC output arrow either side of a labelled box, showing the direction of conversion."><title>Inverter: a functional block, not a single schematic symbol -- a DC input arrow and an AC output arrow either side of a labelled box, showing the direction of conversion.</title><g><text x="120" y="20" fill="#f2f4f8" font-size="14" font-weight="700" text-anchor="middle"><tspan>Inverter</tspan></text><rect x="20" y="34" width="200" height="90" rx="8" fill="#151821" stroke="#262b38" stroke-width="1" /><g><line x1="0" y1="20" x2="14" y2="20" stroke="#f2f4f8" stroke-width="1.5" /><path d="M14 20 10.535898384862245 22 10.535898384862245 18z" fill="#f2f4f8" /><text x="7" y="7" fill="#f2f4f8" font-size="9" font-weight="700" text-anchor="middle"><tspan>DC</tspan></text><rect x="14" y="10" width="32" height="20" fill="none" stroke="#f2f4f8" stroke-width="2" /><path d="M20,24 L20,14 L27,14 L27,24 L34,24 L34,14 L40,14" fill="none" stroke="#f2f4f8" stroke-width="2" /><line x1="46" y1="20" x2="60" y2="20" stroke="#f2f4f8" stroke-width="1.5" /><path d="M60 20 56.53589838486224 22 56.53589838486224 18z" fill="#f2f4f8" /><text x="53" y="7" fill="#f2f4f8" font-size="9" font-weight="700" text-anchor="middle"><tspan>AC</tspan></text></g><text x="120" y="146" fill="#9aa3b2" font-size="11" text-anchor="middle"><tspan>Converts a DC supply into</tspan></text><text x="120" y="160" fill="#9aa3b2" font-size="11" text-anchor="middle"><tspan>an AC output.</tspan></text></g></svg>