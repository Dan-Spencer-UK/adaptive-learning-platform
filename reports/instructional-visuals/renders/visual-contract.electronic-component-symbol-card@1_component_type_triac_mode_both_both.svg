<svg xmlns="http://www.w3.org/2000/svg" width="240" height="210" viewBox="0 0 240 210" role="img" aria-label="TRIAC: like the DIAC's two opposite-pointing triangles, but with an added gate lead -- the gate lead is what distinguishes a TRIAC from a DIAC."><title>TRIAC: like the DIAC's two opposite-pointing triangles, but with an added gate lead -- the gate lead is what distinguishes a TRIAC from a DIAC.</title><g><text x="120" y="20" fill="#f2f4f8" font-size="14" font-weight="700" text-anchor="middle"><tspan>TRIAC</tspan></text><rect x="20" y="34" width="200" height="90" rx="8" fill="#151821" stroke="#262b38" stroke-width="1" /><g><line x1="0" y1="20" x2="16" y2="20" stroke="#f2f4f8" stroke-width="2" /><path d="M16 8 16 32 32 20z" fill="#f2f4f8" stroke="#f2f4f8" stroke-width="2" /><path d="M44 8 44 32 28 20z" fill="#f2f4f8" stroke="#f2f4f8" stroke-width="2" /><line x1="44" y1="20" x2="60" y2="20" stroke="#f2f4f8" stroke-width="2" /><line x1="30" y1="35" x2="40" y2="39" stroke="#f2f4f8" stroke-width="1.5" /><path d="M40 39 36.04088104277841 39.570418339965165 37.52644374819482 35.856511576424126z" fill="#f2f4f8" /></g><text x="120" y="146" fill="#9aa3b2" font-size="11" text-anchor="middle"><tspan>A gate-triggered</tspan></text><text x="120" y="160" fill="#9aa3b2" font-size="11" text-anchor="middle"><tspan>bidirectional AC switch.</tspan></text></g></svg>