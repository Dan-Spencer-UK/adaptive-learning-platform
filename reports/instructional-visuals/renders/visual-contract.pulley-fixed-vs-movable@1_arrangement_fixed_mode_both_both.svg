<svg xmlns="http://www.w3.org/2000/svg" width="240" height="240" viewBox="0 0 240 240" role="img" aria-label="A fixed pulley: the wheel is mounted to a fixed anchor at the top. Effort pulls down on one side of the rope, and the load hangs from the other side. One rope segment supports the load -- the pulley changes the direction of the force but gives no mechanical advantage."><title>A fixed pulley: the wheel is mounted to a fixed anchor at the top. Effort pulls down on one side of the rope, and the load hangs from the other side. One rope segment supports the load -- the pulley changes the direction of the force but gives no mechanical advantage.</title><g><rect x="90" y="16" width="60" height="8" fill="#f2f4f8" /><line x1="90" y1="24" x2="84" y2="34" stroke="#9aa3b2" stroke-width="1.5" /><line x1="105" y1="24" x2="99" y2="34" stroke="#9aa3b2" stroke-width="1.5" /><line x1="120" y1="24" x2="114" y2="34" stroke="#9aa3b2" stroke-width="1.5" /><line x1="135" y1="24" x2="129" y2="34" stroke="#9aa3b2" stroke-width="1.5" /><line x1="150" y1="24" x2="144" y2="34" stroke="#9aa3b2" stroke-width="1.5" /><line x1="120" y1="24" x2="120" y2="37" stroke="#f2f4f8" stroke-width="2" /><circle cx="120" cy="55" r="18" fill="#0b0d12" stroke="#f2f4f8" stroke-width="2" /><line x1="80" y1="55" x2="80" y2="190" stroke="#f2f4f8" stroke-width="2" /><path d="M80 198 74 186 86 186z" fill="#f2f4f8" /><text x="80" y="216" fill="#f2f4f8" font-size="13" font-weight="700" text-anchor="middle"><tspan>Effort</tspan></text><line x1="160" y1="55" x2="160" y2="170" stroke="#f2f4f8" stroke-width="2" /><rect x="144" y="170" width="32" height="26" fill="#0b0d12" stroke="#f2f4f8" stroke-width="2" /><text x="160" y="216" fill="#f2f4f8" font-size="13" font-weight="700" text-anchor="middle"><tspan>Load</tspan></text><text x="120" y="12" fill="#9aa3b2" font-size="11" text-anchor="middle"><tspan>Fixed anchor</tspan></text></g></svg>