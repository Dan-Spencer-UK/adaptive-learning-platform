<svg xmlns="http://www.w3.org/2000/svg" width="240" height="210" viewBox="0 0 240 210" role="img" aria-label="Photodiode: a diode symbol with two small arrows pointing toward it, showing received light -- the opposite of an LED."><title>Photodiode: a diode symbol with two small arrows pointing toward it, showing received light -- the opposite of an LED.</title><g><text x="120" y="20" fill="#f2f4f8" font-size="14" font-weight="700" text-anchor="middle"><tspan>Photodiode</tspan></text><rect x="20" y="34" width="200" height="90" rx="8" fill="#151821" stroke="#262b38" stroke-width="1" /><g><line x1="0" y1="20" x2="20" y2="20" stroke="#f2f4f8" stroke-width="2" /><path d="M20 8 20 32 36 20z" fill="#f2f4f8" stroke="#f2f4f8" stroke-width="2" /><line x1="36" y1="8" x2="36" y2="32" stroke="#f2f4f8" stroke-width="2" /><line x1="36" y1="20" x2="60" y2="20" stroke="#f2f4f8" stroke-width="2" /><line x1="32" y1="1" x2="24" y2="7" stroke="#f2f4f8" stroke-width="1.5" /><path d="M24 7 25.571281292110204 3.3215390309173474 27.971281292110202 6.521539030917347z" fill="#f2f4f8" /><line x1="38" y1="1" x2="30" y2="7" stroke="#f2f4f8" stroke-width="1.5" /><path d="M30 7 31.571281292110204 3.3215390309173474 33.971281292110206 6.521539030917347z" fill="#f2f4f8" /></g><text x="120" y="146" fill="#9aa3b2" font-size="11" text-anchor="middle"><tspan>Generates a photocurrent</tspan></text><text x="120" y="160" fill="#9aa3b2" font-size="11" text-anchor="middle"><tspan>in response to light.</tspan></text></g></svg>