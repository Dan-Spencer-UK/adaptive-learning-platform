<svg xmlns="http://www.w3.org/2000/svg" width="240" height="210" viewBox="0 0 240 210" role="img" aria-label="Resistor: a plain rectangle symbol (BS EN 60617 / IEC 60617), not the US zigzag."><title>Resistor: a plain rectangle symbol (BS EN 60617 / IEC 60617), not the US zigzag.</title><g><text x="120" y="20" fill="#f2f4f8" font-size="14" font-weight="700" text-anchor="middle"><tspan>Resistor</tspan></text><rect x="20" y="34" width="200" height="90" rx="8" fill="#151821" stroke="#262b38" stroke-width="1" /><g><line x1="0" y1="20" x2="18" y2="20" stroke="#f2f4f8" stroke-width="2" /><rect x="18" y="12" width="24" height="16" fill="none" stroke="#f2f4f8" stroke-width="2" /><line x1="42" y1="20" x2="60" y2="20" stroke="#f2f4f8" stroke-width="2" /></g><text x="120" y="146" fill="#9aa3b2" font-size="11" text-anchor="middle"><tspan>Limits current or divides</tspan></text><text x="120" y="160" fill="#9aa3b2" font-size="11" text-anchor="middle"><tspan>voltage.</tspan></text></g></svg>