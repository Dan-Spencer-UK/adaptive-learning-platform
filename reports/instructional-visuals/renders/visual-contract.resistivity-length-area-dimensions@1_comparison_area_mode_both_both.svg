<svg xmlns="http://www.w3.org/2000/svg" width="260" height="200" viewBox="0 0 260 200" role="img" aria-label="Comparing conductor cross-sectional area, with length and material held the same: the thinner rod has more resistance, and the thicker rod has less resistance."><title>Comparing conductor cross-sectional area, with length and material held the same: the thinner rod has more resistance, and the thicker rod has less resistance.</title><g><rect x="46" y="44" width="138" height="12" fill="#0b0d12" stroke="#f2f4f8" stroke-width="2" /><ellipse cx="184" cy="50" rx="6" ry="6" fill="#0b0d12" stroke="#f2f4f8" stroke-width="2" /><ellipse cx="46" cy="50" rx="6" ry="6" fill="#0b0d12" stroke="#f2f4f8" stroke-width="2" /><line x1="32" y1="44" x2="32" y2="56" stroke="#9aa3b2" stroke-width="1.5" /><text x="22" y="54" fill="#9aa3b2" font-size="12" font-weight="700" text-anchor="middle"><tspan>A</tspan></text><text x="115" y="34" fill="#f2f4f8" font-size="11" text-anchor="middle"><tspan>thinner -&gt; more resistance</tspan></text><rect x="46" y="113" width="138" height="34" fill="#0b0d12" stroke="#f2f4f8" stroke-width="2" /><ellipse cx="184" cy="130" rx="6" ry="17" fill="#0b0d12" stroke="#f2f4f8" stroke-width="2" /><ellipse cx="46" cy="130" rx="6" ry="17" fill="#0b0d12" stroke="#f2f4f8" stroke-width="2" /><line x1="32" y1="113" x2="32" y2="147" stroke="#9aa3b2" stroke-width="1.5" /><text x="22" y="134" fill="#9aa3b2" font-size="12" font-weight="700" text-anchor="middle"><tspan>A</tspan></text><text x="115" y="103" fill="#f2f4f8" font-size="11" text-anchor="middle"><tspan>thicker -&gt; less resistance</tspan></text></g></svg>