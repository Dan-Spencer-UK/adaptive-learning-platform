<svg xmlns="http://www.w3.org/2000/svg" width="240" height="210" viewBox="0 0 240 210" role="img" aria-label="Zener diode: a diode symbol with the bar bent into a kinked Z-shape at both ends, distinguishing it from a standard diode."><title>Zener diode: a diode symbol with the bar bent into a kinked Z-shape at both ends, distinguishing it from a standard diode.</title><g><text x="120" y="20" fill="#f2f4f8" font-size="14" font-weight="700" text-anchor="middle"><tspan>Zener diode</tspan></text><rect x="20" y="34" width="200" height="90" rx="8" fill="#151821" stroke="#262b38" stroke-width="1" /><g><line x1="0" y1="20" x2="20" y2="20" stroke="#f2f4f8" stroke-width="2" /><path d="M20 8 20 32 36 20z" fill="#f2f4f8" stroke="#f2f4f8" stroke-width="2" /><line x1="36" y1="8" x2="36" y2="32" stroke="#f2f4f8" stroke-width="2" /><line x1="36" y1="8" x2="40" y2="4" stroke="#f2f4f8" stroke-width="2" /><line x1="36" y1="32" x2="32" y2="36" stroke="#f2f4f8" stroke-width="2" /><line x1="36" y1="20" x2="60" y2="20" stroke="#f2f4f8" stroke-width="2" /></g><text x="120" y="146" fill="#9aa3b2" font-size="11" text-anchor="middle"><tspan>Holds a constant voltage</tspan></text><text x="120" y="160" fill="#9aa3b2" font-size="11" text-anchor="middle"><tspan>in reverse breakdown.</tspan></text></g></svg>